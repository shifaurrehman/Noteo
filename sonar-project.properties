sonar.projectKey=shifaurrehman_Ai-Note-Taker
sonar.organization=shifatech

# Point exactly to your code
sonar.sources=src
# Ensure we only look at actual source code
sonar.inclusions=src/**/*.ts,src/**/*.tsx
# Combined exclusions for node_modules, build artifacts, and specific internal folders
sonar.exclusions=**/node_modules/**, **/.expo/**, **/dist/**, **/assets/**, src/**/__tests__/**, src/**/*.test.ts, src/**/*.test.tsx

# Point to your tests for the "Test" metric
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx

# Coverage reporting
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
