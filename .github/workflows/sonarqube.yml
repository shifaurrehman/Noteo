name: SonarQube Analysis

on:
  pull_request:
    branches:
      - development
      - master
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@6114389622d1591eda738166c433cce56f5c5b96 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests (Optional, for coverage)
        run: npm test -- --coverage --watchAll=false
        continue-on-error: true # Don't fail if tests fail, let SonarQube report them

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d8ca843a85497fba02c11451f28b493393b43719 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
